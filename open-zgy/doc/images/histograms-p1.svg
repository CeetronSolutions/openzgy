     id="layer1">
    <text
       xml:space="preserve"
       style="font-style:normal;font-weight:normal;font-size:4.23333px;line-height:1.25;font-family:sans-serif;fill:#000000;fill-opacity:1;stroke:none;stroke-width:0.264583"
       x="15.273688"
       y="31.224524"
       id="text1109"><tspan
         sodipodi:role="line"
         id="tspan1107"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="31.224524">/**</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="36.516186"
         id="tspan6101"> * Collect sample statistics and create a 4096-bin intermediate histogram.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="41.807846"
         id="tspan6103"> * When done collecting, convert the histogram to 256-bin zero-centric.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="47.09951"
         id="tspan6105"> * The intermediate histogram can also be accessed. But that will have many</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="52.391174"
         id="tspan6107"> * empty bins and won't be zero-centric.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="57.682835"
         id="tspan6109"> *</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="62.974495"
         id="tspan6111"> * When the builder is not fixed-width, the intermediate size a.k.a. bin count</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="68.266159"
         id="tspan6113"> * must be at least twice that of the desired result. Choosing a too large</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="73.557823"
         id="tspan6115"> * size might have a performance impact. Especially on the cost of operator+=.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="78.849487"
         id="tspan6117"> *</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="84.141144"
         id="tspan6119"> * To get a fixed-width histogram, specify the range when creating the builder.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="89.432808"
         id="tspan6121"> * The intermediate size must in this case be the same as the final size.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="94.724472"
         id="tspan6123"> *</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="100.01613"
         id="tspan6125"> *     Example: SampleHistogramBuilder builder(256, -100, +100).</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="105.30779"
         id="tspan6127"> *</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="110.59946"
         id="tspan6129"> * The choice of range is not adjusted to become zero centric. You might want</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="115.89112"
         id="tspan6131"> * to do that</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="121.18279"
         id="tspan6133"> * yourself.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="126.47444"
         id="tspan6135"> *</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="131.7661"
         id="tspan6137"> * For multi-threaded computation, use one builder for each thread and combine</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="137.05777"
         id="tspan6139"> * the results at the end by using operator+=.</tspan><tspan
         sodipodi:role="line"
         style="font-size:4.23333px;fill:#803300;stroke-width:0.264583"
         x="15.273688"
         y="142.34943"
         id="tspan6141"> */</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="147.84398"
         id="tspan6143"><tspan
   style="fill:#ff00ff"
   id="tspan58865">static</tspan> void</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
