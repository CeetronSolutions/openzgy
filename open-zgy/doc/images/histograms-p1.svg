   id="tspan147247">data3</tspan> {0};</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="180.81129"
         id="tspan6155" /><tspan
