         x="15.273688"
         y="186.30585"
         id="tspan6157">  <tspan
   style="fill:#d45500"
   id="tspan180459">// Add samples from two very short traces.</tspan></tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="191.8004"
         id="tspan6159">  <tspan
   style="fill:#008000"
   id="tspan117805">SampleHistogramBuilder</tspan> <tspan
   style="fill:#800000"
   id="tspan151599">builder</tspan>(4096);</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="197.29495"
         id="tspan6161">  builder.add(data1.data(), data1.data() + data1.size());</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="202.78951"
         id="tspan6163">  builder.add(data2.data(), data2.data() + data2.size());</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="208.28406"
         id="tspan6165" /><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="213.77859"
         id="tspan6167">  <tspan
   style="fill:#d45500"
   id="tspan183953">// Add 999 samples with value zero.</tspan></tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="219.27315"
         id="tspan6169">  <tspan
   style="fill:#008000"
   id="tspan126207">SampleHistogramBuilder</tspan> <tspan
   style="fill:#800000"
   id="tspan156473">tmp</tspan>(4096);</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="224.7677"
         id="tspan6171">  tmp.add(data3.data(), data3.data() + data3.size());</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="230.26225"
         id="tspan6173">  tmp *= 999;</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="235.75681"
         id="tspan6175">  builder += tmp;</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="241.25136"
         id="tspan6177" /><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.23333px;font-family:'Ubuntu Mono';-inkscape-font-specification:'Ubuntu Mono';stroke-width:0.264583"
         x="15.273688"
         y="246.74591"
         id="tspan6179">  <tspan
   style="fill:#ff00ff"
