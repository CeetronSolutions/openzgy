include:
  - template: Auto-DevOps.gitlab-ci.yml
  - local: gitlab/templates.yml
  
stages:
  - prepare
  - build
  - test
  - review
  - deploy  # dummy stage to follow the template guidelines
  - dast
  - staging
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - performance
  - cleanup

variables:
    SHA_IMAGE_TAG: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA
    VS_COMMUNITY_PATH: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Community'
    MSBUILD_PATH: '$VS_COMMUNITY_PATH\MSBuild\Current\Bin\msbuild.exe'
    CMAKE_PATH: '$VS_COMMUNITY_PATH\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\'
    CONFIGURATION: Release
    PLATFORM: x64
    DEPLOY_FOLDER: '/build/deploy/native/$PLATFORM/$CONFIGURATION/'
    OPENZGY_TESTDATA: '$CI_PROJECT_DIR/build/testdata'
    TEST_RUNNER: '$CI_PROJECT_DIR\build\deploy\native\$PLATFORM\$CONFIGURATION\OpenZGY.Test.exe'
    SOLUTION_FILE_PATH: '$CI_PROJECT_DIR\native\windows\OpenZGY.sln'
    
    CONTAINER_SCANNING_DISABLED: "1"
    AUTO_DEVOPS_EXPLICITLY_ENABLED: "1"
    TEST_DISABLED: "1"
    CODE_QUALITY_DISABLED: ""
    BUILD_DISABLED: "1"


build:
  rules:    #introducing BUILD_DISABLED: overriding original rule to be able to ignore the original job
    - if: '$BUILD_DISABLED'
      when: never
    
build_artifact:
  script: exit 0    #does not do anything, override to ignore original job
  rules:
    - if: '$BUILD_DISABLED'
      when: never
doc-container:
  stage: prepare
  image: docker:19.03
  tags:
  - docker-runner
  script:
  - mkdir -p seismic-service-bin private
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  - grep -v '^COPY' scripts/Dockerfile-doc | docker build --pull -t $SHA_IMAGE_TAG-doc
    -f - .
  - docker push $SHA_IMAGE_TAG-doc
  only:
  - master
  - merge_requests
  - kvamme62/citest
  - kvamme62/cicd
  - skorozsi/sast
  

# A ready-made image prepared by the seismic store team, is used for compilation.
# The image contains all the necessary components for SDAPI compilation.
# It makes building OpenZGY with SDAPI much faster and easier.
#
# Benefits:
#  * SDAPI dependencies are frozen in the base image.
#  * SDAPI itself gets built from the latest sources.
#  * OpenZGY-only dependencies get the latest version available.
#  * OpenZGY gets built from the latest sources.
#
# Neutral:
#  * Cloning the SDAPI source is done inside the container, in .compile-job.
#  * Cloning the OpenZGY source is done by gitlab and mounted inside the container.
#
# Drawbacks:
#  * Adding support for a new platform is more complicated.
#  * Patches to the base OS are not picked up automatically.
#  * The OpenZGY code has less control over its environment.
#  * Changes may need to be coordinated across tech centers.
#  * Multiple-inheritance issues. E.g. Python is not needed by SDAPI or its
#    dependencies, but is needed both by OpenZGY and Omega. The choice of
#    Python version doesn't belong in the base image. But we might need to
#    put it there.
#
# TODO
#  Prepare ready-made images in our registry for all supported platforms.
#  Compile the documentation based on the ready-made image.


