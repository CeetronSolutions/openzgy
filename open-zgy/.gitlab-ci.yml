doc-compile:
  stage: build
  image: "$SHA_IMAGE_TAG-doc"
  tags:
  - docker-runner
  artifacts:
    name: OpenZGY-doc
    expire_in: 1 hr
    paths:
    - build/deploy
  script:
  - make doxygen
  only:
  - master
  - merge_requests
  - kvamme62/citest
  - kvamme62/cicd
  - skorozsi/sast
  


windows-build-x64-release:
  stage: build
  when: manual
  tags:
    - windows
  only:
    - master
    - merge_requests
    - skorozsi/pipeline
    - skorozsi/sast
  script:
    - |
      $env:Path += ";$CMAKE_PATH"
      $collectionOfArgs = @("$SOLUTION_FILE_PATH", "/p:Configuration=Release", "/p:Platform=x64")
      & "$MSBUILD_PATH" $collectionOfArgs
  artifacts:
    name: 'openzgy-windows-x64-release'
    paths:
      - build/deploy/native/x64/Release/
      - build/testdata
  dependencies: []

windows-build-x64-debug:
  stage: build
  when: manual
  tags:
    - windows
  only:
    - master
    - merge_requests
    - skorozsi/pipeline
    - skorozsi/sast
  script:
    - |
      $env:Path += ";$CMAKE_PATH"
      $collectionOfArgs = @("$SOLUTION_FILE_PATH", "/p:Configuration=Debug", "/p:Platform=x64")
      & "$MSBUILD_PATH" $collectionOfArgs
  artifacts:
    name: 'openzgy-windows-x64-debug'
    paths:
      - build/deploy/native/x64/Debug/
  dependencies: []

windows-test:
  stage: test
  when: manual
  only:
    - master
    - merge_requests
    - skorozsi/pipeline
    - skorozsi/sast
  tags:
    - windows
  script:
    - |
      & $TEST_RUNNER
  dependencies:
    - windows-build-x64-release
    
code_quality:
  stage: test
  image: docker:19.03.12
  allow_failure: true
  services:
    - docker:19.03.12-dind
  variables:
    REPORT_FORMAT: json
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CODE_QUALITY_IMAGE: "registry.gitlab.com/gitlab-org/ci-cd/codequality:0.85.18-gitlab.1"
  needs: []
  script:
    - docker info
    - docker run 
       --env CODECLIMATE_DEBUG=1 
       --env CODECLIMATE_CODE="$PWD" 
       --volume "$PWD":/code 
       --volume /var/run/docker.sock:/var/run/docker.sock 
       --volume /tmp/cc:/tmp/cc 
       codeclimate/codeclimate:0.85.13 analyze -f html > code-quality-report.html
    - cat code-quality-report.html
  retry: 2
  artifacts:
    paths: [code-quality-report.html]
    reports:
      codequality: [code-quality-report.html]
    expire_in: 1 week
  dependencies: []
  rules:
    - if: '$CODE_QUALITY_DISABLED'
      when: never
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH'

