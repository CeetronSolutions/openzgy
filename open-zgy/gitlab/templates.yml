# Deploy job templates

.deploy_job: 
  stage: deploy
  image: docker:19.03
  script: |
   set -e -x
   apk add curl
   ls -laR 
   echo "${CI_API_V4_URL}"
   echo "${CI_PROJECT_ID}"
   set +e
   WRAPPERWHEEL=$(find build/deploy/wrapper -name \*.whl | sort | head -1)
   OPENZGYVERSION=$(echo $WRAPPERWHEEL | sed -ne 's;^.*/OpenZgyBindings-\([0-9][0-9a-zA-Z.]*\)-.*$;\1;p')
   : ${OPENZGYVERSION:=noversion}
   OPENZGYPATH=$(find "$(pwd -P)" -name OpenZGY.${LINUXDISTRO}*.tar.gz)
   OPENZGYFILE=$(basename ${OPENZGYPATH})

   echo WRAPPERWHEEL=${WRAPPERWHEEL}
   echo OPENZGYVERSION=${OPENZGYVERSION}
   echo OPENZGYPATH${OPENZGYPATH}
   echo OPENZGYFILE${OPENZGYFILE}
   set -e
   curl -v --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ${OPENZGYPATH} "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/OpenZGY/$OPENZGYVERSION/${OPENZGYFILE}"


# Test templates. Can be used if we put tests in a separate job.

.test:
  stage: test
  image: # OVERRIDE-IN-CHILD
  before_script:
  - |
    export CLIENT_ID="" 
    export CLIENT_SECRET="" 
    export OPENZGY_SDURL="" 
    export OPENZGY_SDAPIKEY="" 
    export OPENZGY_TOKEN="" 
    export OPENZGY_TESTDATA="../testdata" 
    export OPENZGY_SDTESTDATA="sd://opendes/slb-testdata"
    export OPENZGY_SDTESTSINK="sd://opendes/slb-testsink/a"

.test-jammy:
  extends: .test
  image: community.opengroup.org:5555/osdu/platform/domain-data-mgmt-services/seismic/seismic-dms-suite/seismic-store-cpp-lib/sdapi-osdu-ubuntu22-gcc11-static-deps:latest
  script:
  - !reference [.install-extras-any-ubuntu, script]
  - !reference [.install-built-packages-any, script]
  - echo "SDTESTDATA=${SDTESTDATA}"
  - echo "RUN native/src/runtests.sh"; native/src/runtests.sh
  - echo "RUN wrapper/runtests.sh";    wrapper/runtests.sh
  dependencies:
  - jammy-compile-azure-curl

