
parameters:
- name:    linuxdistro
  type:    string
  default: centos8
- name:    upublish
  type:    boolean
  default: false

jobs:
- job: builder_${{parameters.linuxdistro}}
  displayName: 'Build ${{parameters.linuxdistro}} tarball'

  # Be careful when bumping the version number. NuGet versions can
  # never count downwards. Universal packages can do this but cannot
  # re-use a previous verson number even after it is permanently
  # deleted. the version number can only be two digits here, so the
  # official major version is part of the package name. Probably just
  # as well. Append e.g. -dev for experimental builds that will be
  # published as a universal package.

  variables:
  - template: versions.yml
    parameters:
      linuxdistro: '${{parameters.linuxdistro}}'
      tagtail: 'default'
  - name: dockertag
    value: az-build-sdapi-${{parameters.linuxdistro}}

  steps:
  - checkout: self
    clean: true
    path: s

  - bash: |
      echo "Settings from azure/templates/versions.yml, master = $(is_master)"
      echo "Only starred items are relevant for this pipeline."
      echo "  * Clone   SDAPI   '$(x_sdapi3_hash)'"
      echo "  * Produce SDAPI   '$(x_sdapi3_produce_pkgname)' '$(x_sdapi3_produce_version)'"
      echo "    Consume SDAPI   '$(x_sdapi3_consume_pkgname)' '$(x_sdapi3_consume_version)'"
      echo "    Produce OpenZGY '$(x_openzgy_produce_pkgname)' '$(x_openzgy_produce_version)' (version not used yet)"
      echo "    Consume OpenZGY '$(x_openzgy_consume_pkgname)' '$(x_openzgy_consume_version)'"
      echo "    Clone   OpenVDS '$(x_vds_checkout)'"
      echo "    Produce OpenVDS '$(x_vds_produce_pkgname)' '$(x_vds_produce_version)'"
      echo "    Consume OpenVDS '$(x_vds_consume_pkgname)' '$(x_vds_consume_version)'"
      echo "    Produce ZgyTool '$(x_zgytool_produce_pkgname)' '$(x_zgytool_produce_version)' (version not used yet)"
    condition: always()
    displayName: 'SDAPI version selection'

  - bash: |
      echo "Publish universal packages:   ${{parameters.upublish}}"
    displayName: 'Build parameters'

  - bash: |
      # Note: here the sdapi is inside the openzgy folder,
      # inside the docker builder it is one level up.
      rm -rf seismic-store-cpp-lib
      git clone https://community.opengroup.org/osdu/platform/domain-data-mgmt-services/seismic/seismic-dms-suite/seismic-store-cpp-lib.git seismic-store-cpp-lib -n
      cd seismic-store-cpp-lib
      git checkout ${{variables.x_sdapi3_hash}}
      git submodule update --init --recursive 
      echo "All files in $(pwd)"; ls -FC || true
    displayName: 'Download open source'

  - bash: |
      # See azure/README.md regarding race conditions for ${TAG}.
      # This pipeline does not run tests. So the race is harmless.
      set -e -x
      cd sd-env
      export LINUXDISTRO=${{parameters.linuxdistro}}
      DOCKERFILE=Dockerfile-${LINUXDISTRO}
      TAG=${{variables.dockertag}}
      IID=iid.${LINUXDISTRO}.$$
      CID=cid.${LINUXDISTRO}.$$
      TARBALL=sdapi_linux64.tar.gz
      /bin/rm -f ${IID} ${CID}
      docker tag ${TAG} ${TAG}:old || true
      docker build --pull -f ${DOCKERFILE} --target sdapi-build -t ${TAG} --iidfile ${IID} ..
      docker rmi ${TAG}:old || true
      docker create --cidfile ${CID} $(cat ${IID})
      REAL=$(docker cp $(cat ${CID}):/home/me/realname.txt - | tar -Oxvf -)
      REAL2=$(docker cp $(cat ${CID}):/home/me/realname2.txt - | tar -Oxvf -)
      test "${REAL}" != ""
      test "${REAL2}" != ""
      # mkdir -p $(Build.ArtifactStagingDirectory)/$(dirname ${REAL})
      # mkdir -p $(Build.ArtifactStagingDirectory)/$(dirname ${REAL2})
      # docker cp $(cat ${CID}):/home/me/${TARBALL} $(Build.ArtifactStagingDirectory)/${REAL}
      # docker cp $(cat ${CID}):/home/me/${TARBALL} $(Build.ArtifactStagingDirectory)/${REAL2}
      docker cp $(cat ${CID}):/home/me/${TARBALL} $(Build.ArtifactStagingDirectory)
      docker rm $(cat ${CID})
      /bin/rm -f ${IID} ${CID}
      echo "${TARBALL}" >  $(Build.ArtifactStagingDirectory)/remarks.txt
      echo "${REAL}"    >> $(Build.ArtifactStagingDirectory)/remarks.txt
      echo "${REAL2}"   >> $(Build.ArtifactStagingDirectory)/remarks.txt
      echo "${{variables.x_sdapi3_remarks}}" >> $(Build.ArtifactStagingDirectory)/remarks.txt
      tar ztvf $(Build.ArtifactStagingDirectory)/${TARBALL} > $(Build.ArtifactStagingDirectory)/files.txt
    displayName: 'Build SDAPI'

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)
      artifactName: SDAPI-${{parameters.linuxdistro}}

  - task: UniversalPackages@0
    inputs:
      command: 'publish'
      publishDirectory: $(Build.ArtifactStagingDirectory)
      feedsToUsePublish: 'internal'
      vstsFeedPublish: 'openzgy'
      vstsFeedPackagePublish: ${{variables.x_sdapi3_produce_pkgname}}
      versionOption: 'custom'
      versionPublish: ${{variables.x_sdapi3_produce_version}}
      packagePublishDescription: 'SDAPI built for use in OpenZGY'
    condition: and(succeeded(), ${{parameters.upublish}})
    displayName: 'Publish universal'
