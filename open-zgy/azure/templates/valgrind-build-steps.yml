# Based on build-steps.yml but used to make a valgrind report.
# The following explanation might help to keep the two in sync.
# Disable optimizer when building.
# Change "runtests.sh" to "runtests.sh valgrind" two places
# Both the remaining tests need to copy out some files,
# which means the cid needs to be captured. The files are:
#    build/deploy/native/valgrind.txt
#    build/deploy/wrapper/valgrind-1.txt
#    build/deploy/wrapper/valgrind-2.txt
# This is also reflected in CopyFiles@2, only export valgrind*.txt.
# Remove the "universal publish" step.

parameters:
  linuxdistro: 'rocky8'
  deployed: .
  makeargs: ''
  tagtail: 'default'

steps:
- checkout: self
  clean: true
  path: s

- bash: |
    echo "Settings from azure/templates/versions.yml, master = $(is_master)"
    echo "Only starred items are relevant for this pipeline."
    echo "    Clone   SDAPI   '$(x_sdapi3_hash)'"
    echo "    Produce SDAPI   '$(x_sdapi3_produce_pkgname)' '$(x_sdapi3_produce_version)'"
    echo "  * Consume SDAPI   '$(x_sdapi3_consume_pkgname)' '$(x_sdapi3_consume_version)'"
    echo "  * Produce OpenZGY '$(x_openzgy_produce_pkgname)' '$(x_openzgy_produce_version)' (version not used yet)"
    echo "    Consume OpenZGY '$(x_openzgy_consume_pkgname)' '$(x_openzgy_consume_version)'"
    echo "    Clone   OpenVDS '$(x_vds_checkout)'"
    echo "    Produce OpenVDS '$(x_vds_produce_pkgname)' '$(x_vds_produce_version)'"
    echo "    Consume OpenVDS '$(x_vds_consume_pkgname)' '$(x_vds_consume_version)'"
    echo "    Produce ZgyTool '$(x_zgytool_produce_pkgname)' '$(x_zgytool_produce_version)' (version not used yet)"
  condition: always()
  displayName: 'OpenZGY/Valgrind version selection'

- task: UniversalPackages@0
  inputs:
    command: 'download'
    downloadDirectory: $(Build.SourcesDirectory)/pkg
    feedsToUse: 'internal'
    vstsFeed: 'openzgy'
    vstsFeedPackage: '$(x_sdapi3_consume_pkgname)'
    vstsPackageVersion: '$(x_sdapi3_consume_version)'
  condition: and(succeeded(), ne('${{parameters.tagtail}}', 'nosd'))
  displayName: 'Download SDAPI'

- bash: |
    eval $(test ! -x private/grabtoken.sh || private/grabtoken.sh -vv)
  env:
    OPENZGY_SDURL: $(SEISMIC_STORE_URL)
    OPENZGY_SDAPIKEY: $(SEISMIC_STORE_KEY)
    CLIENT_ID:        $(OPENZGY_TEST_CLIENT_ID)
    CLIENT_SECRET:    $(OPENZGY_TEST_CLIENT_SECRET)
    SD_TARGET_AUDIENCE: '$(OPENZGY_TEST_CLIENT_ID) $(OPENZGY_TEST_CLIENT_AUDIENCE)'
    SDAPI_SAUTH_TOKEN_SERVICE_URL: '$(SEISMIC_STORE_TKSVC_URL)'
  displayName: 'Show SAuth token'

- bash: |
    # See azure/README.md regarding race conditions for ${TAG}.
    set -e -x
    export LINUXDISTRO=${{parameters.linuxdistro}}
    export DOCKERFILE=scripts/Dockerfile-${LINUXDISTRO}
    TAG=azure-build-openzgy-${LINUXDISTRO}-${{parameters.tagtail}}
    docker tag ${TAG} ${TAG}:old || true
    mkdir -p private
    docker build --pull -t ${TAG} -f ${DOCKERFILE} .
    docker rmi -f ${TAG}:old ${TAG}:test || true
    /bin/rm -f cid.txt
    docker run --cidfile cid.txt -e LINUXDISTRO -e AZURE_BUILDID=$(Build.BuildId) ${TAG} make ${{parameters.makeargs}} build testscripts
    # Do we really need both deploy.tgz and deploy/ ?
    # Note, keep the CopyFiles task below in sync with this choice.
    # deploy.tgz needs download to check the contents
    # deploy/** breaks symbolic links.
    # In the valgrind build, This file is normally not deployed.
    # See the copyfiles step.
    docker cp $(cat cid.txt):/home/me/oz/build/deploy/. - | gzip -9 > openzgy-install.tgz
    docker rm $(cat cid.txt)
    /bin/rm -f cid.txt
    docker build -t ${TAG}:test -f ${DOCKERFILE}-test .

  displayName: 'Build OpenZGY'

- bash: |
    set -x
    TAG=azure-build-openzgy-${{parameters.linuxdistro}}-${{parameters.tagtail}}
    /bin/rm -f cid.txt
    docker run --cidfile cid.txt --cap-add sys_ptrace --security-opt=seccomp=unconfined -e CLIENT_ID -e CLIENT_SECRET -e OPENZGY_SDURL -e OPENZGY_SDAPIKEY -e SD_TARGET_AUDIENCE -e SDAPI_SAUTH_TOKEN_SERVICE_URL -e LINUXDISTRO=${{parameters.linuxdistro}} ${TAG}:test native/src/runtests.sh valgrind
    docker cp $(cat cid.txt):/home/me/oz/build/deploy/native/valgrind.txt .
    echo "Files in `pwd`"; ls -l
    docker rm $(cat cid.txt)
    /bin/rm -f cid.txt
    set +x
  env:
    OPENZGY_SDURL: $(SEISMIC_STORE_URL)
    OPENZGY_SDAPIKEY: $(SEISMIC_STORE_KEY)
    CLIENT_ID:     $(OPENZGY_TEST_CLIENT_ID)
    CLIENT_SECRET: $(OPENZGY_TEST_CLIENT_SECRET)
    SD_TARGET_AUDIENCE: '$(OPENZGY_TEST_CLIENT_ID) $(OPENZGY_TEST_CLIENT_AUDIENCE)'
    SDAPI_SAUTH_TOKEN_SERVICE_URL: '$(SEISMIC_STORE_TKSVC_URL)'
  displayName: 'Test all native'

- bash: |
    TAG=azure-build-openzgy-${{parameters.linuxdistro}}-${{parameters.tagtail}}
    /bin/rm -f cid.txt
    docker run --cidfile cid.txt --cap-add sys_ptrace --security-opt=seccomp=unconfined -e CLIENT_ID -e CLIENT_SECRET -e OPENZGY_SDURL -e OPENZGY_SDAPIKEY -e SD_TARGET_AUDIENCE -e SDAPI_SAUTH_TOKEN_SERVICE_URL -e LINUXDISTRO=${{parameters.linuxdistro}} ${TAG}:test wrapper/runtests.sh valgrind
    docker cp $(cat cid.txt):/home/me/oz/build/deploy/wrapper/valgrind-1.txt .
    docker cp $(cat cid.txt):/home/me/oz/build/deploy/wrapper/valgrind-2.txt .
    docker rm $(cat cid.txt)
    /bin/rm -f cid.txt
  env:
    OPENZGY_SDURL: $(SEISMIC_STORE_URL)
    OPENZGY_SDAPIKEY: $(SEISMIC_STORE_KEY)
    CLIENT_ID:     $(OPENZGY_TEST_CLIENT_ID)
    CLIENT_SECRET: $(OPENZGY_TEST_CLIENT_SECRET)
    SD_TARGET_AUDIENCE: '$(OPENZGY_TEST_CLIENT_ID) $(OPENZGY_TEST_CLIENT_AUDIENCE)'
    SDAPI_SAUTH_TOKEN_SERVICE_URL: '$(SEISMIC_STORE_TKSVC_URL)'
  displayName: 'Test wrapper'

- task: CopyFiles@2
  inputs:
    contents: |
      valgrind*.txt
    targetFolder: $(Build.ArtifactStagingDirectory)
    flattenFolders: false

- bash: |
    echo === Contents of $(Build.ArtifactStagingDirectory)
    find $(Build.ArtifactStagingDirectory) -print
    set -e -f
    echo ===
    (
      cd "$(Build.ArtifactStagingDirectory)"
      for i in ${{parameters.deployed}}
      do
        echo "Check that $i exists"
        file=$(set +f; set -- $i; echo $1)
        test -d "$file" -o -s "$file" || (echo "$file is missing"; exit 42)
      done
    )
  displayName: 'Check that artifacts exist'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)
    artifactName: OpenZGY-${{parameters.linuxdistro}}
